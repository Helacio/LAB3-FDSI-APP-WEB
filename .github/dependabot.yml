# SCA continuo (A06): PRs semanales de actualización con parches de seguridad.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # no proponer versiones recién publicadas (posible paquete malicioso)
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # no proponer versiones recién publicadas (posible paquete malicioso)
    groups:
      angular:
        patterns: ["@angular/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # no proponer versiones recién publicadas (posible paquete malicioso)
