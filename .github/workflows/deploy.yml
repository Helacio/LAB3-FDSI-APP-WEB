name: Deploy a Azure VM Ubuntu
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Configurar Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend Go
        working-directory: backend
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o muvbackend .

      - name: Publicar frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser

      - name: Publicar backend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-bin
          path: backend/muvbackend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Descargar frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: staging/frontend

      - name: Descargar backend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-bin
          path: staging

      - name: Preparar staging
        run: |
          cp nginx/muvautomation.conf staging/
          mkdir -p staging/snippets
          cp nginx/snippets/muvautomation.conf staging/snippets/
          cp deploy/muvautomation.service staging/
          cp deploy/install.sh staging/
          chmod +x staging/install.sh
          ls -la staging

      - name: Preparar directorio temporal en la VM
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            rm -rf /tmp/muv-deploy
            mkdir -p /tmp/muv-deploy

      - name: Copiar artefactos a la VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "staging/"
          strip_components: 1
          target: "/tmp/muv-deploy"

      - name: Instalar y recargar servicios
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            sudo bash /tmp/muv-deploy/install.sh /tmp/muv-deploy
            sudo nginx -t && sudo systemctl reload nginx
