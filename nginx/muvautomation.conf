# /etc/nginx/sites-available/muvautomation
# Laboratorio 3 - Frontend Angular + backend Go (API en 127.0.0.1:8080).
# Sirve el SPA por HTTP, sin autenticacion, y hace proxy de /api al backend.
# HTTPS e identidad -> Laboratorio 4.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/muvautomation;
    index index.html;
    server_name _;

    # --- SPA Angular (fallback a index.html para rutas del cliente) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API Go + MongoDB ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Hardening inicial (Paso 15) ---
    server_tokens off;                                   # no revelar version en banners/errores
    autoindex off;                                       # no listar directorios

    add_header X-Content-Type-Options "nosniff" always;  # no adivinar MIME
    add_header X-Frame-Options "DENY" always;            # sin framing
    add_header Referrer-Policy "no-referrer" always;     # no filtrar URL de origen

    location ~ /\. {                                     # denegar rutas ocultas (.git, .env, etc.)
        deny all;
        return 404;
    }
}
