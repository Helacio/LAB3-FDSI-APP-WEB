# /etc/nginx/sites-available/muvautomation
# Frontend Angular + backend Go (API en 127.0.0.1:8080).
# HTTPS con CA interna (Lab 3.2). HTTP redirige a HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # CRL de la CA interna (excepcion al redirect: la CRL esta firmada, viaja por HTTP)
    location = /crl/muv-ca.crl {
        root /opt/muvautomation;
        default_type application/pkix-crl;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Todo lo demas redirige a HTTPS (R1)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    root /var/www/muvautomation;
    index index.html;
    server_name _;

    ssl_certificate     /etc/ssl/certs/muvautomation-chain.crt;
    ssl_certificate_key /etc/ssl/private/muvautomation.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling off;  # CA interna sin OCSP responder; revisar antes de activar

    add_header Strict-Transport-Security "max-age=86400" always;  # subir a 31536000 tras validar

    include snippets/muvautomation.conf;
}
