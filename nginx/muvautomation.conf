# /etc/nginx/sites-available/muvautomation
# Frontend Angular + backend Go (API en 127.0.0.1:8080).
# HTTP (Lab 3) + HTTPS con certificado autofirmado (preparacion Lab 4).

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/muvautomation;
    index index.html;
    server_name _;

    include snippets/muvautomation.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    root /var/www/muvautomation;
    index index.html;
    server_name _;

    ssl_certificate     /etc/ssl/certs/muvautomation.crt;
    ssl_certificate_key /etc/ssl/private/muvautomation.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include snippets/muvautomation.conf;
}
