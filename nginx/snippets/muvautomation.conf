# /etc/nginx/snippets/muvautomation.conf
# Locations y hardening compartidos entre los bloques server HTTP y HTTPS.

# --- SPA Angular (fallback a index.html para rutas del cliente) ---
# `expires` no anula los add_header heredados (a diferencia de add_header).
location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}

# --- Limites de peticion (A04/A05) ---
client_max_body_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;
limit_req_status 429;

# --- Autenticacion: rate limit estricto (A07) ---
location /api/auth/ {
    limit_req zone=muv_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# --- API Go + MongoDB ---
location /api/ {
    limit_req zone=muv_api burst=40 nodelay;
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# --- SSE de monitoreo de estados (sin buffering) ---
location = /api/status/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
}

# --- Hardening inicial (Paso 15) ---
server_tokens off;
autoindex off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

location ~ /\. {
    deny all;
    return 404;
}
