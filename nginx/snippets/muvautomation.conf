# /etc/nginx/snippets/muvautomation.conf
# Locations y hardening compartidos entre los bloques server HTTP y HTTPS.

# --- SPA Angular (fallback a index.html para rutas del cliente) ---
location / {
    try_files $uri $uri/ /index.html;
}

# --- API Go + MongoDB ---
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# --- SSE de monitoreo de estados (sin buffering) ---
location = /api/status/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
}

# --- Hardening inicial (Paso 15) ---
server_tokens off;
autoindex off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

location ~ /\. {
    deny all;
    return 404;
}
